# Cloudflare Workers config. Run `npm run build` first; `npx wrangler deploy`
# then uploads the built worker and static files. The bindings below are also
# used by `nuxt dev` (local D1).
name = "pokedex-checker"
main = ".output/server/index.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pokedex"
# Replace with the id printed by `npx wrangler d1 create pokedex`
database_id = "f0f12775-5b45-476a-84df-6eacdd7988e2"
migrations_dir = "migrations"

[assets]
directory = ".output/public"
binding = "ASSETS"
